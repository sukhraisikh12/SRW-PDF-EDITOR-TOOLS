
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111827">
<meta name="description" content="SRW PDF TOOLS - PDF Compress, PDF to Image and Image to PDF">
<link rel="manifest" href="./manifest.json">

<title>SRW PDF TOOLS</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#eef2f7;
 color:#172033;
}

header{
 background:#071b3d;
 color:white;
 text-align:center;
 padding:17px 8px;
 font-size:23px;
 font-weight:bold;
}

.moving-patti{
 display:flex;
 align-items:center;
 height:68px;
 overflow:hidden;
 background:#071b3d;
 border-bottom:3px solid #e5ae32;
}

.artist-photo{
 width:60px;
 min-width:60px;
 height:60px;
 padding:4px;
}

.artist-photo img{
 width:100%;
 height:100%;
 border-radius:50%;
 object-fit:cover;
 border:2px solid white;
}

.patti-text{
 flex:1;
 overflow:hidden;
 white-space:nowrap;
}

.moving-text{
 display:flex;
 width:max-content;
 color:white;
 font-size:17px;
 font-weight:bold;
 animation:scrollText 14s linear infinite;
}

.moving-text span{padding-right:35px}

@keyframes scrollText{
 from{transform:translateX(0)}
 to{transform:translateX(-50%)}
}

nav{
 display:flex;
 overflow-x:auto;
 background:#102b55;
}

nav button{
 flex:1;
 min-width:110px;
 padding:14px 8px;
 border:0;
 color:white;
 background:#102b55;
 font-weight:bold;
}

nav button.active{
 background:#e5ae32;
 color:#071b3d;
}

.container{
 max-width:650px;
 margin:15px auto;
 padding:12px;
}

.panel{
 display:none;
 background:white;
 padding:17px;
 border-radius:12px;
 box-shadow:0 2px 10px #0001;
}

.panel.active{display:block}

h2{
 margin-top:0;
 color:#102b55;
}

label{
 display:block;
 font-weight:bold;
 margin:14px 0 6px;
}

input,select{
 width:100%;
 padding:12px;
 border:1px solid #bbb;
 border-radius:7px;
 margin-bottom:10px;
 background:white;
}

.btn{
 display:block;
 width:100%;
 border:0;
 padding:13px;
 margin:10px 0;
 border-radius:7px;
 background:#102b55;
 color:white;
 font-size:16px;
 font-weight:bold;
}

.btn.gold{
 background:#e5ae32;
 color:#071b3d;
}

.btn.green{background:#16834a}

.preview{
 margin:10px 0;
 padding:10px;
 background:#f3f5f8;
 border-radius:8px;
}

.preview canvas,.preview img{
 max-width:100%;
 height:auto;
 display:block;
 margin:8px auto;
}

.small{
 font-size:13px;
 color:#555;
 overflow-wrap:anywhere;
}

footer{
 text-align:center;
 background:#071b3d;
 color:white;
 padding:18px;
 margin-top:25px;
}
</style>
</head>

<body>

<header>SRW PDF TOOLS</header>

<div class="moving-patti">
 <div class="artist-photo">
  <img src="./sukhdev.jpg" alt="Sukhdev Rai Warwal">
 </div>
 <div class="patti-text">
  <div class="moving-text">
   <span>★ SRW PDF EDITOR ★ SUKHDEV RAI WARWAL ★</span>
   <span>★ SRW PDF EDITOR ★ SUKHDEV RAI WARWAL ★</span>
  </div>
 </div>
</div>

<nav>
 <button class="active" onclick="showTab('compress',this)">PDF Compress</button>
 <button onclick="showTab('pdfimage',this)">PDF To Image</button>
 <button onclick="showTab('imagepdf',this)">Image To PDF</button>
</nav>

<div class="container">

<section id="compress" class="panel active">
<h2>PDF Compressor</h2>

<label>PDF फाइल चुनें</label>
<input type="file" id="compressFile" accept="application/pdf">

<label>फाइल का नया नाम</label>
<input type="text" id="compressName" value="SRW_Compressed">

<label>PDF Size चुनें</label>
<select id="targetSize" onchange="toggleCustomSize()">
 <option value="100">100 KB</option>
 <option value="200">200 KB</option>
 <option value="500">500 KB</option>
 <option value="1024">1 MB</option>
 <option value="2048">2 MB</option>
 <option value="best">Best Quality</option>
 <option value="custom">Custom Size</option>
</select>

<div id="customBox" style="display:none">
 <label>Custom Size</label>
 <input type="number" id="customValue" placeholder="जैसे 300">
 <select id="customUnit">
  <option value="KB">KB</option>
  <option value="MB">MB</option>
 </select>
</div>

<button class="btn gold" onclick="compressPDF()">PDF Compress करें</button>
<div id="compressStatus" class="small"></div>
</section>

<section id="pdfimage" class="panel">
<h2>PDF To Image</h2>

<label>PDF फाइल चुनें</label>
<input type="file" id="pdfFile" accept="application/pdf">

<label>PDF Password (अगर लगा हो)</label>
<input type="password" id="pdfPassword" placeholder="Password डालें">

<button class="btn gold" onclick="convertPDF()">PDF खोलें</button>
<div id="pdfPreview"></div>
</section>

<section id="imagepdf" class="panel">
<h2>Image To PDF</h2>

<label>फोटो चुनें</label>
<input type="file" id="imageFiles" accept="image/*" multiple>

<label>PDF का नाम</label>
<input type="text" id="imagePdfName" value="SRW_Image_PDF">

<label>PDF Password (वैकल्पिक)</label>
<input type="password" id="imagePassword" placeholder="Password">

<label>Confirm Password</label>
<input type="password" id="confirmPassword" placeholder="Password दोबारा डालें">

<button class="btn gold" onclick="makePDF()">Image To PDF बनाएं</button>
<div id="imageStatus" class="small"></div>
</section>

</div>

<footer>SRW PDF EDITOR BY SUKHDEV RAI 5DD © 2026</footer>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

function showTab(id,btn){
 document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
 document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
 document.getElementById(id).classList.add('active');
 btn.classList.add('active');
}

function toggleCustomSize(){
 document.getElementById('customBox').style.display =
 document.getElementById('targetSize').value==='custom'?'block':'none';
}

function downloadBlob(blob,name){
 const url=URL.createObjectURL(blob);
 const a=document.createElement('a');
 a.href=url;
 a.download=name;
 document.body.appendChild(a);
 a.click();
 a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),5000);
}

// PDF COMPRESS
async function compressPDF(){
 const file=document.getElementById('compressFile').files[0];
 const status=document.getElementById('compressStatus');

 if(!file){alert('पहले PDF फाइल चुनें');return}

 let target=document.getElementById('targetSize').value;

 if(target==='custom'){
  let num=parseFloat(document.getElementById('customValue').value);
  if(!num||num<=0){alert('Custom Size डालें');return}
  target=num*(document.getElementById('customUnit').value==='MB'?1024:1);
 }else if(target==='best'){
  target=null;
 }else{
  target=parseFloat(target);
 }

 const name=(document.getElementById('compressName').value||'SRW_Compressed').replace(/\.pdf$/i,'');

 status.textContent='PDF Compress हो रही है...';

 try{
  const data=await file.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data}).promise;
  const {jsPDF}=window.jspdf;

  let doc=null;
  let ratio=1;

  if(target){
   ratio=Math.min(1,target/(file.size/1024));
  }

  let scale=target?Math.max(.5,Math.min(1.5,Math.sqrt(ratio))):1.3;
  let quality=target?Math.max(.25,Math.min(.9,ratio)):0.92;

  for(let i=1;i<=pdf.numPages;i++){
   const page=await pdf.getPage(i);
   const viewport=page.getViewport({scale});
   const canvas=document.createElement('canvas');
   const ctx=canvas.getContext('2d');

   canvas.width=Math.floor(viewport.width);
   canvas.height=Math.floor(viewport.height);

   await page.render({canvasContext:ctx,viewport}).promise;

   const img=canvas.toDataURL('image/jpeg',quality);
   const orientation=viewport.width>viewport.height?'landscape':'portrait';

   if(!doc){
    doc=new jsPDF({
     orientation,
     unit:'pt',
     format:[viewport.width,viewport.height],
     compress:true
    });
   }else{
    doc.addPage([viewport.width,viewport.height],orientation);
   }

   doc.addImage(img,'JPEG',0,0,viewport.width,viewport.height);
   status.textContent='Page '+i+' / '+pdf.numPages+' तैयार...';

   canvas.width=0;
   canvas.height=0;
  }

  const blob=doc.output('blob');
  downloadBlob(blob,name+'.pdf');

  status.textContent='PDF तैयार। फाइल साइज: '+Math.round(blob.size/1024)+' KB. चुना गया साइज अनुमानित है।';

 }catch(e){
  console.error(e);
  status.textContent='PDF Compress नहीं हुई। फाइल या ब्राउज़र सपोर्ट जांचें।';
 }
}

// PDF TO IMAGE
async function convertPDF(){
 const file=document.getElementById('pdfFile').files[0];
 const preview=document.getElementById('pdfPreview');

 if(!file){alert('PDF फाइल चुनें');return}

 preview.textContent='PDF खुल रही है...';

 try{
  const password=document.getElementById('pdfPassword').value;
  const data=await file.arrayBuffer();

  const pdf=await pdfjsLib.getDocument({
   data,
   password:password||undefined
  }).promise;

  preview.innerHTML='';

  for(let i=1;i<=pdf.numPages;i++){
   const page=await pdf.getPage(i);
   const viewport=page.getViewport({scale:2});
   const canvas=document.createElement('canvas');
   const ctx=canvas.getContext('2d');

   canvas.width=viewport.width;
   canvas.height=viewport.height;

   await page.render({canvasContext:ctx,viewport}).promise;

   const box=document.createElement('div');
   box.className='preview';

   const heading=document.createElement('p');
   heading.textContent='Page '+i;
   box.appendChild(heading);

   const img=document.createElement('img');
   img.src=canvas.toDataURL('image/jpeg',0.95);
   box.appendChild(img);

   const normal=document.createElement('button');
   normal.className='btn';
   normal.textContent='Normal Download';
   normal.onclick=()=>downloadImage(img.src,'SRW_Page_'+i+'.jpg',1);
   box.appendChild(normal);

   const hd=document.createElement('button');
   hd.className='btn gold';
   hd.textContent='HD Download';
   hd.onclick=()=>downloadImage(img.src,'SRW_Page_'+i+'_HD.jpg',1.5);
   box.appendChild(hd);

   const share=document.createElement('button');
   share.className='btn green';
   share.textContent='Share';
   share.onclick=()=>shareImage(img.src,'SRW_Page_'+i+'.jpg');
   box.appendChild(share);

   preview.appendChild(box);
   canvas.width=0;
   canvas.height=0;
  }

 }catch(e){
  console.error(e);
  preview.textContent='PDF नहीं खुली। Password गलत हो सकता है या फाइल में समस्या है।';
 }
}

function downloadImage(src,name,scale){
 const img=new Image();

 img.onload=()=>{
  const canvas=document.createElement('canvas');
  canvas.width=img.width*scale;
  canvas.height=img.height*scale;

  const ctx=canvas.getContext('2d');
  ctx.drawImage(img,0,0,canvas.width,canvas.height);

  canvas.toBlob(blob=>{
   if(blob)downloadBlob(blob,name);
   else alert('Image डाउनलोड नहीं हो पाई');
  },'image/jpeg',0.98);
 };

 img.onerror=()=>alert('Image तैयार नहीं हो पाई');
 img.src=src;
}

async function shareImage(src,name){
 try{
  const response=await fetch(src);
  const blob=await response.blob();
  const file=new File([blob],name,{type:'image/jpeg'});

  if(navigator.canShare&&navigator.canShare({files:[file]})){
   await navigator.share({files:[file],title:name});
  }else{
   downloadBlob(blob,name);
   alert('Share उपलब्ध नहीं है, Image डाउनलोड कर दी गई है।');
  }
 }catch(e){
  alert('Share नहीं हो पाया।');
 }
}

// IMAGE TO PDF
async function makePDF(){
 const files=document.getElementById('imageFiles').files;
 const status=document.getElementById('imageStatus');

 if(!files.length){alert('फोटो चुनें');return}

 const password=document.getElementById('imagePassword').value;
 const confirm=document.getElementById('confirmPassword').value;

 if(password!==confirm){
  alert('दोनों Password एक जैसे नहीं हैं');
  return;
 }

 if(password){
  alert('इस संस्करण में PDF Password Protection लागू नहीं है। Password खाली छोड़कर PDF बनाएं।');
  return;
 }

 status.textContent='PDF बन रही है...';

 try{
  const {jsPDF}=window.jspdf;
  let doc=null;

  for(let i=0;i<files.length;i++){
   const dataUrl=await readImage(files[i]);
   const img=await loadImage(dataUrl);

   const orientation=img.width>img.height?'landscape':'portrait';

   if(!doc){
    doc=new jsPDF({
     orientation,
     unit:'px',
     format:[img.width,img.height]
    });
   }else{
    doc.addPage([img.width,img.height],orientation);
   }

   const format=files[i].type==='image/png'?'PNG':'JPEG';
   doc.addImage(dataUrl,format,0,0,img.width,img.height);

   status.textContent='फोटो '+(i+1)+' / '+files.length+' जोड़ी गई';
  }

  const name=(document.getElementById('imagePdfName').value||'SRW_Image_PDF').replace(/\.pdf$/i,'');

  const blob=doc.output('blob');
  downloadBlob(blob,name+'.pdf');
  status.textContent='PDF डाउनलोड हो गई।';

 }catch(e){
  console.error(e);
  status.textContent='PDF नहीं बन पाई। दोबारा कोशिश करें।';
 }
}

function readImage(file){
 return new Promise((resolve,reject)=>{
  const reader=new FileReader();
  reader.onload=()=>resolve(reader.result);
  reader.onerror=reject;
  reader.readAsDataURL(file);
 });
}

function loadImage(src){
 return new Promise((resolve,reject)=>{
  const img=new Image();
  img.onload=()=>resolve(img);
  img.onerror=reject;
  img.src=src;
 });
}

// SERVICE WORKER
if('serviceWorker' in navigator){
 window.addEventListener('load',()=>{
  navigator.serviceWorker.register('./sw.js')
   .then(()=>console.log('SRW App Ready'))
   .catch(error=>console.error('SW Error:',error));
 });
}
</script>

</body>
</html>
